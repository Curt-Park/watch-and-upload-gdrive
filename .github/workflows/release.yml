name: Release

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
            binary: wug-linux-amd64
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
            binary: wug-darwin-amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
            binary: wug-darwin-arm64
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
            binary: wug-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          OUTPUT_DIR: .
          CGO_ENABLED: 0
        run: |
          make build-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

